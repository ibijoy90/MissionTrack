apiVersion: v1
kind: Pod

metadata:
  name: secure-pod
  namespace: missiontrack-dev

spec:
  automountServiceAccountToken: false

  containers:
  - name: nginx

    image: nginx

    securityContext:

      runAsNonRoot: true

      allowPrivilegeEscalation: false

      readOnlyRootFilesystem: true

      capabilities:
        drop:
        - ALL

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"

      limits:
        cpu: "250m"
        memory: "256Mi"