apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: missiontrack-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
      - name: nginx

        image: nginxinc/nginx-unprivileged

        ports:
        - containerPort: 8080

        securityContext:
          allowPrivilegeEscalation: false

          capabilities:
            drop:
            - ALL