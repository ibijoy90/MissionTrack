apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: missiontrack-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged

          ports:
            - containerPort: 8080

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL