apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: missiontrack-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      serviceAccountName: frontend-sa

      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

          capabilities:
            drop:
              - ALL

        ports:
        - containerPort: 8080