name: MissionTrack Security Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.76.2_Linux-64bit.tar.gz
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz

      - name: Trivy Scan
        run: |
          ./trivy config . --severity HIGH,CRITICAL --exit-code 1
